---
fullnameOverride: metrics-server
replicas: 3
priorityClassName: system-cluster-critical
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
metrics:
  enabled: false
serviceMonitor:
  enabled: false
  interval: 5m
  scrapeTimeout: 30s
args:
  - --kubelet-insecure-tls
resources:
  limits:
    cpu: 100m
    memory: 200Mi
  requests:
    cpu: 50m
    memory: 100Mi