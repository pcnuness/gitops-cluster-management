---
# EKS Addons specific overrides for cluster management
eks-addons:
  # Core DNS addon
  coredns:
    enabled: true
    version: "v1.10.1-eksbuild.1"
    resolveConflicts: OVERWRITE
    configurationValues: |
      computeType: Fargate
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
  # Kube Proxy addon
  kubeProxy:
    enabled: true
    version: "v1.28.1-eksbuild.1"
    resolveConflicts: OVERWRITE
  # VPC CNI addon
  vpcCni:
    enabled: true
    version: "v1.14.1-eksbuild.1"
    resolveConflicts: OVERWRITE
    configurationValues: |
      env:
        ENABLE_PREFIX_DELEGATION: "true"
        ENABLE_POD_ENI: "true"
        POD_SECURITY_GROUP_ENFORCING_MODE: "standard"
  # EBS CSI Driver addon
  ebsCsiDriver:
    enabled: true
    version: "v1.23.0-eksbuild.1"
    resolveConflicts: OVERWRITE
    serviceAccountRoleArn: "arn:aws:iam::{{ .Values.awsAccountId }}:role/AmazonEKS_EBS_CSI_DriverRole"
  # EFS CSI Driver addon
  efsCsiDriver:
    enabled: true
    version: "v1.7.1-eksbuild.1"
    resolveConflicts: OVERWRITE
    serviceAccountRoleArn: "arn:aws:iam::{{ .Values.awsAccountId }}:role/AmazonEKS_EFS_CSI_DriverRole"
