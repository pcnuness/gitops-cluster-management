---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-apps-ecommerce
  namespace: argocd
  annotations:
    gitops.plataform/area: Application
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/pcnuness/gitops-cluster-management.git
              revision: main
              files:
                - path: "applications/*/"
              values:
                app_name: "{{path[1]}}"
          - clusters:
              selector:
                matchExpressions:
                  - key: environment
                    operator: In
                    values: ["{{values.environment}}"]
  template:
    metadata:
      name: "app-ecommerce-{{values.app_name}}-{{values.environment}}"
    spec:
      project: app-ecommerce-{{values.environment}}
      source:
        repoURL: https://github.com/pcnuness/gitops-cluster-management.git
        targetRevision: migration
        path: charts/base-template
        helm:
          valueFiles:
            - $values/{{path}}
      destination:
        name: '{{name}}'
        namespace: project-ecommerce
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
