---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-aws-eks-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    gitops.plataform/area: cloud
    gitops.plataform/service: eks
    gitops.plataform/component: addons
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        values:
          addonChart: eks-addons
          addonChartNamespace: kube-system
  template:
    metadata:
      name: addon-aws-{{values.addonChart}}-{{name}}
    spec:
      project: cluster-management
      sources:
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          ref: values
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          path: environments/{{metadata.annotations.environment}}/{{values.addonChart}}
        - repoURL: 'https://github.com/pcnuness/gitops-cluster-management.git'
          targetRevision: 'main'
          path: addons/{{values.addonChart}}
          helm:
            ignoreMissingValueFiles: true
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
