---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-all
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    gitops.plataform/area: platform
    gitops.plataform/service: addons
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonCharts:
                  - name: crossplane
                    namespace: crossplane-system
                    syncWave: -1
                  - name: grafana
                    namespace: observability
                    syncWave: 0
                  - name: metrics-server
                    namespace: kube-system
                    syncWave: 1
  template:
    metadata:
      name: addon-oss-{{values.addonCharts.name}}-{{name}}
      annotations:
        argocd.argoproj.io/sync-wave: "{{values.addonCharts.syncWave}}"
    spec:
      project: cluster-management
      sources:
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          ref: values
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          path: environments/{{metadata.annotations.environment}}/{{values.addonCharts.name}}
        - repoURL: 'https://github.com/pcnuness/gitops-cluster-management.git'
          targetRevision: 'main'
          path: addons/{{values.addonCharts.name}}
          helm:
            ignoreMissingValueFiles: true
      destination:
        namespace: '{{values.addonCharts.namespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
