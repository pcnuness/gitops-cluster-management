---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-keda
  annotations:
    gitops.plataform/area: devops
    gitops.plataform/service: autoscaling
    gitops.plataform/managed-by: plataform-team
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: keda
                addonChartReleaseName: keda
                addonChartNamespace: keda
                addonChartVersion: 2.17.1
                addonChartRepository: https://kedacore.github.io/charts
              selector:
                matchExpressions:
                  - key: enable_keda
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: staging
              values:
                addonChartVersion: 2.17.1
          - clusters:
              selector:
                matchLabels:
                  environment: production
              values:
                addonChartVersion: 2.17.1
  template:
    metadata:
      name: addon-{{values.addonChart}}-{{name}}
    spec:
      project: autoscaling
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChartReleaseName}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
            values: |
              keda:
                clusterName: {{metadata.annotations.aws_cluster_name}}
                serviceAccount:
                  operator:
                    create: true
                    name: {{metadata.annotations.keda_service_account}}
                    annotations:
                      eks.amazonaws.com/role-arn: {{metadata.annotations.keda_iam_role_arn}}
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true