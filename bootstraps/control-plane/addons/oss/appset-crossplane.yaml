---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    gitops.plataform/area: cloud
    gitops.plataform/service: iac
    gitops.plataform/component: crossplane
    gitops.plataform/managed-by: foundation
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: crossplane
                addonChartNamespace: crossplane-system
                addonChartVersion: 1.20.0
                addonChartRepository: https://charts.crossplane.io/stable
  template:
    metadata:
      name: addon-oss-{{values.addonChart}}-{{name}}
    spec:
      project: cluster-management
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/addons/{{values.addonChart}}/values.yaml
            values: |
              serviceAccount:
                create: true
                name: "provider-aws"
                customAnnotations:
                  eks.amazonaws.com/role-arn: {{metadata.annotations.crossplane_iam_role_arn}}
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true  # Big CRDs.
      ignoreDifferences:
        - kind: Deployment
          group: apps
          jqPathExpressions:
            - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
            - .spec.template.spec.initContainers[].env[].valueFrom.resourceFieldRef.divisor