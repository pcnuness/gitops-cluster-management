---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    gitops.plataform/area: cloud
    gitops.plataform/service: iac
    gitops.plataform/component: crossplane
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        values:
          addonChart: crossplane
          addonChartNamespace: crossplane-system
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values: ["{{values.environment}}"]
  template:
    metadata:
      name: addon-oss-{{values.addonChart}}-{{name}}
    spec:
      project: cluster-management
      sources:
        # Source 1: Repositório central (platform-addons-charts) para valores default e do ambiente
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          ref: values-central
        # Source 2: Repositório do cluster (gitops-cluster-management) para valores customizados
        - repoURL: 'https://github.com/pcnuness/gitops-cluster-management.git'
          targetRevision: 'main'
          ref: values-cluster
        # Source 3: Chart principal do addon
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          path: environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}
          helm:
            valueFiles:
              # Ordem de precedência: último sobrescreve os anteriores
              - $values-central/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values-cluster/addons/{{values.addonChart}}/values.yaml
            ignoreMissingValueFiles: true
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

