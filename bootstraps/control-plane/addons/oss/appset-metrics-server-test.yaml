---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-metrics-server-test
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    gitops.plataform/area: monitoring
    gitops.plataform/service: metrics
    gitops.plataform/component: metrics-server
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        values:
          addonChart: metrics-server
          addonChartNamespace: kube-system
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values: ["develop"]
  template:
    metadata:
      name: addon-oss-{{values.addonChart}}-{{name}}-test
    spec:
      project: cluster-management
      source:
        repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
        targetRevision: 'main'
        path: environments/develop/addons/metrics-server
        helm:
          valueFiles:
            - $values/environments/default/addons/metrics-server/values.yaml
            - $values/environments/develop/addons/metrics-server/values.yaml
            - $values/addons/metrics-server/values.yaml
          ignoreMissingValueFiles: true
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - kind: Deployment
          group: apps
          jqPathExpressions:
            - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
            - .spec.template.spec.initContainers[].env[].valueFrom.resourceFieldRef.divisor
