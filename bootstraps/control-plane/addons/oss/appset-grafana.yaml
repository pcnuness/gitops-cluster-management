---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-grafana
  annotations:
    gitops.plataform/area: observability
    gitops.plataform/service: grafana
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        values:
          addonChart: grafana
          addonChartReleaseName: grafana
          addonChartNamespace: observability
  template:
    metadata:
      name: addon-{{values.addonChart}}-{{name}}
    spec:
      project: cluster-management
      sources:
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          ref: values
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          path: environments/{{metadata.labels.environment}}/{{values.addonChart}}
        - repoURL: 'https://github.com/pcnuness/gitops-cluster-management.git'
          targetRevision: 'main'
          path: addons/{{values.addonChart}}
          helm:
            ignoreMissingValueFiles: true
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 