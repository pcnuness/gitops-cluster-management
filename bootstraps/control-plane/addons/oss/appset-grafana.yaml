---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-grafana
  annotations:
    gitops.plataform/area: observability
    gitops.plataform/service: grafana
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: grafana
                addonChartReleaseName: grafana
                addonChartNamespace: observability
  template:
    metadata:
      name: addon-{{values.addonChart}}-{{name}}
    spec:
      project: cluster-management
      sources:
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          path: environments/{{metadata.annotations.environment}}/{{values.addonChart}}
          helm:
            valueFiles:
              - $values/environments/default/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.annotations.environment}}/{{values.addonChart}}/values.yaml
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          path: environments/{{metadata.annotations.environment}}/{{values.addonChart}}
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/addons/{{values.addonChart}}/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 