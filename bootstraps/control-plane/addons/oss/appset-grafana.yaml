---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-grafana
  annotations:
    gitops.plataform/area: observability
    gitops.plataform/service: grafana
    gitops.plataform/managed-by: foundation
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: grafana
                addonChartReleaseName: grafana
                addonChartNamespace: observability
                addonChartVersion: 9.2.10
                addonChartRepository: https://grafana.github.io/helm-charts
  template:
    metadata:
      name: addon-{{values.addonChart}}-{{name}}
    spec:
      project: cluster-management
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChartReleaseName}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/addons/default/{{values.addonChart}}/values.yaml
              - $values/addons/{{values.addonChart}}/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 