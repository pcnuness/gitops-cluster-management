apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-metrics-server
  namespace: argocd # O namespace onde o ArgoCD está instalado
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    gitops.plataform/area: monitoring
    gitops.plataform/service: metrics
    gitops.plataform/component: metrics-server
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    # Usaremos o generator 'clusters' para selecionar clusters baseados em labels.
    # Assumimos que seus ClusterSecrets no ArgoCD têm uma label 'environment'.
    - clusters:
        selector:
          matchLabels:
            environment: develop # Exemplo: Este AppSet irá aplicar-se a clusters com a label 'environment: develop'
        # Você pode adicionar valores padrão aqui se quiser que sejam acessíveis via {{values.<key>}}
        # values:
        #   addonChart: metrics-server
        #   addonChartNamespace: kube-system
  template:
    metadata:
      # '{{name}}' é o nome do ClusterSecret (nome do cluster no ArgoCD)
      name: addon-oss-metrics-server-{{name}}
    spec:
      project: cluster-management
      sources:
        # --- Fonte 1: O Chart base do repositório 'platform-addons-charts' ---
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git' # URL do seu repositório de Charts
          targetRevision: 'main' # Ou a branch/tag que você utiliza
          # O caminho para o Chart específico do addon e ambiente.
          # '{{metadata.labels.environment}}' pega o valor da label 'environment' do ClusterSecret.
          path: environments/{{metadata.labels.environment}}/addons/metrics-server
          ref: base-chart # Nome de referência para esta fonte, usado em valueFiles
          helm:
            valueFiles:
              # Primeiro, aplica o values.yaml que está junto ao Chart base (base-chart/values.yaml)
              - values.yaml
            ignoreMissingValueFiles: true # Ignora se algum dos valueFiles não for encontrado, útil durante o desenvolvimento
        # --- Fonte 2: Os valores customizados do repositório 'gitops-cluster-management' ---
        - repoURL: 'https://github.com/pcnuness/gitops-cluster-management.git' # URL do seu repositório de gerenciamento (onde este AppSet reside)
          targetRevision: 'main' # Ou a branch/tag que você utiliza
          # Caminho para o values.yaml customizado para o metrics-server
          path: addons/metrics-server
          ref: custom-values
          helm:
            valueFiles:
              # Segundo, aplica o values.yaml do repositório de customização (custom-values/values.yaml)
              # Os valores deste arquivo sobrescreverão os do anterior em caso de conflito.
              - $custom-values/values.yaml
            ignoreMissingValueFiles: true  # Nome de referência para esta fonte, usado em valueFiles
      destination:
        namespace: kube-system # Namespace onde o metrics-server será instalado (pode ser parametrizado com {{values.addonChartNamespace}} se definido no generator)
        name: '{{name}}' # O cluster alvo é o nome do ClusterSecret
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true