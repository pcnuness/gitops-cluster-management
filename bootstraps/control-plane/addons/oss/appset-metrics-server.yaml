apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-metrics-server
  namespace: argocd # O namespace onde o ArgoCD está instalado
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    gitops.plataform/area: monitoring
    gitops.plataform/service: metrics
    gitops.plataform/component: metrics-server
    gitops.plataform/managed-by: foundations
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    # Usaremos o generator 'clusters' para selecionar clusters baseados em labels.
    # Assumimos que seus ClusterSecrets no ArgoCD têm uma label 'environment'.
    - clusters:
        selector:
          matchLabels:
            environment: develop # Exemplo: Este AppSet irá aplicar-se a clusters com a label 'environment: develop'
  template:
    metadata:
      # '{{name}}' é o nome do ClusterSecret (nome do cluster no ArgoCD)
      name: addon-oss-metrics-server-{{name}}
    spec:
      project: cluster-management
      sources:
        # Source 1: O Chart base do repositório 'platform-addons-charts'
        # Esta fonte aponta para o diretório que contém o Chart.yaml (o Chart Helm em si)
        - repoURL: 'https://github.com/pcnuness/platform-addons-charts.git'
          targetRevision: 'main'
          # O caminho para o Chart específico do addon e ambiente.
          # '{{labels.environment}}' pega o valor da label 'environment' do ClusterSecret.
          path: environments/develop/addons/metrics-server
          ref: base-chart # Nome de referência para esta fonte

        # Source 2: Os valores customizados do repositório 'gitops-cluster-management'
        # Esta fonte aponta para o diretório que contém o values.yaml de customização
        - repoURL: 'https://github.com/pcnuness/gitops-cluster-management.git'
          targetRevision: 'main'
          path: addons/metrics-server
          ref: custom-values # Nome de referência para esta fonte

      # O bloco 'helm' deve estar AQUI, no mesmo nível que 'sources'.
      # Ele define como os 'valueFiles' das fontes serão combinados.
      helm:
        valueFiles:
          # A ordem importa! O último arquivo na lista sobrepõe os valores dos anteriores.
          # 1. Valores padrão do Chart base (do platform-addons-charts para o ambiente específico)
          #- $base-chart/values.yaml
          # 2. Valores customizados (do gitops-cluster-management) que sobrepõem os padrão
          - $custom-values/values.yaml
        ignoreMissingValueFiles: true # Útil para não falhar se um dos values.yaml não existir

      destination:
        namespace: kube-system # Namespace onde o metrics-server será instalado
        name: '{{name}}' # O cluster alvo é o nome do ClusterSecret
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - kind: Deployment
          group: apps
          jqPathExpressions:
            - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
            - .spec.template.spec.initContainers[].env[].valueFrom.resourceFieldRef.divisor