---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oss-grafana-mimir
  annotations:
    gitops.plataform/area: observability
    gitops.plataform/service: metrics
    gitops.plataform/managed-by: plataform-team
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: mimir-distributed
                addonChartReleaseName: mimir
                addonChartNamespace: observability
                addonChartVersion: 5.7.0
                addonChartRepository: https://grafana.github.io/helm-charts
              selector:
                matchExpressions:
                  - key: enable_grafana_mimir
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: stage
              values:
                addonChartVersion: 5.7.0
          - clusters:
              selector:
                matchLabels:
                  environment: production
              values:
                addonChartVersion: 5.7.0
  template:
    metadata:
      name: addon-{{values.addonChart}}-{{name}}
    spec:
      project: cluster-management
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChartReleaseName}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/mimir/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/mimir/values.yaml
              - $values/clusters/{{name}}/addons/mimir/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 