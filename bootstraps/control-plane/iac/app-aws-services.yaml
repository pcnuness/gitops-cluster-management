---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-iac-aws-services
  namespace: argocd
  annotations:
    gitops.plataform/area: cloud
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/pcnuness/gitops-cluster-management.git
              revision: main
              files:
                - path: "iac/*/*/values.yaml"
              values:
                svc_name: "{{path[1]}}"
                app_name: "{{path[2]}}"
  template:
    metadata:
      name: "iac-aws-{{values.svc_name}}-{{values.app_name}}-{{name}}"
      labels:
        gitops.plataform/src: '{{values.svc_name}}'
        gitops.plataform/app: '{{values.app_name}}'
        gitops.plataform/cluster: '{{name}}'
    spec:
      project: iac-aws
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: 'clusters/{{name}}/iac/{{values.svc_name}}/{{values.app_name}}'
      destination:
        name: '{{name}}'
        namespace: iac-aws-{{values.svc_name}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true